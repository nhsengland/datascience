<svg viewBox="0 0 1120 360" role="img" aria-labelledby="fs-title fs-desc" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000000">
  <title id="fs-title">How Feature Store turns source tables into a table ready for analysis</title>
  <desc id="fs-desc">Two source tables, Patients and Admissions, feed three shared feature definitions in Feature Store: age at admission, prior admissions and length of stay. The output is one row per admission with those three features attached, plus a usage log of the datasets and feature versions used. All data shown is fabricated.</desc>
  <defs>
    <marker id="fs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f2f2f"/>
    </marker>
  </defs>

  <!-- Patients -->
  <text x="20" y="52" font-size="14" font-weight="700">Patients</text>
  <g transform="translate(20,62)">
    <rect width="340" height="112" fill="#ffffff" stroke="#dddddd"/>
    <rect width="340" height="28" fill="#f1f1f1" stroke="#dddddd"/>
    <g stroke="#dddddd"><line x1="0" y1="56" x2="340" y2="56"/><line x1="0" y1="84" x2="340" y2="84"/><line x1="120" y1="0" x2="120" y2="112"/></g>
    <g font-weight="700"><text x="10" y="19">patient_id</text><text x="130" y="19">date_of_birth</text></g>
    <text x="10" y="47">p01</text><text x="130" y="47">1938-01-14</text>
    <text x="10" y="75">p02</text><text x="130" y="75">1961-06-30</text>
    <text x="10" y="103">p03</text><text x="130" y="103">1990-11-02</text>
  </g>

  <!-- Admissions -->
  <text x="20" y="222" font-size="14" font-weight="700">Admissions</text>
  <g transform="translate(20,232)">
    <rect width="340" height="112" fill="#ffffff" stroke="#dddddd"/>
    <rect width="340" height="28" fill="#f1f1f1" stroke="#dddddd"/>
    <g stroke="#dddddd"><line x1="0" y1="56" x2="340" y2="56"/><line x1="0" y1="84" x2="340" y2="84"/><line x1="90" y1="0" x2="90" y2="112"/><line x1="166" y1="0" x2="166" y2="112"/><line x1="253" y1="0" x2="253" y2="112"/></g>
    <g font-weight="700"><text x="8" y="19">admission_id</text><text x="98" y="19">patient_id</text><text x="174" y="19">admitted</text><text x="261" y="19">discharged</text></g>
    <text x="8" y="47">a001</text><text x="98" y="47">p01</text><text x="174" y="47">2026-01-10</text><text x="261" y="47">2026-01-14</text>
    <text x="8" y="75">a002</text><text x="98" y="75">p02</text><text x="174" y="75">2026-02-03</text><text x="261" y="75">2026-02-04</text>
    <text x="8" y="103">a003</text><text x="98" y="103">p01</text><text x="174" y="103">2026-03-21</text><text x="261" y="103">2026-03-28</text>
  </g>

  <g stroke="#2f2f2f" stroke-width="1.5" marker-end="url(#fs-arrow)">
    <line x1="366" y1="118" x2="396" y2="118"/>
    <line x1="366" y1="288" x2="396" y2="288"/>
    <line x1="724" y1="118" x2="774" y2="118"/>
    <line x1="724" y1="288" x2="774" y2="288"/>
  </g>

  <!-- Feature Store -->
  <rect x="400" y="40" width="320" height="304" fill="#ffffff" stroke="#005eb8" stroke-width="2"/>
  <rect x="400" y="40" width="320" height="36" fill="#005eb8"/>
  <text x="416" y="64" font-size="16" font-weight="700" fill="#ffffff">Feature Store</text>
  <text x="416" y="100" fill="#2f2f2f">Each feature is defined once and shared.</text>

  <rect x="416" y="114" width="288" height="56" fill="#e5f1fa"/>
  <text x="428" y="137" font-size="14" font-weight="700">Age at admission</text>
  <text x="428" y="157" fill="#2f2f2f">Age on the day of admission</text>

  <rect x="416" y="180" width="288" height="56" fill="#e5f1fa"/>
  <text x="428" y="203" font-size="14" font-weight="700">Prior admissions</text>
  <text x="428" y="223" fill="#2f2f2f">Admissions in the previous 12 months</text>

  <rect x="416" y="246" width="288" height="56" fill="#e5f1fa"/>
  <text x="428" y="269" font-size="14" font-weight="700">Length of stay</text>
  <text x="428" y="289" fill="#2f2f2f">Days from admission to discharge</text>

  <text x="416" y="328" fill="#2f2f2f">Runs on pandas, PySpark or Polars</text>

  <!-- Output -->
  <text x="780" y="52" font-size="14" font-weight="700">One row per admission</text>
  <g transform="translate(780,62)">
    <rect width="320" height="112" fill="#ffffff" stroke="#dddddd"/>
    <rect x="84" y="28" width="236" height="84" fill="#e5f1fa"/>
    <rect width="320" height="28" fill="#f1f1f1" stroke="#dddddd"/>
    <g stroke="#dddddd"><line x1="0" y1="56" x2="320" y2="56"/><line x1="0" y1="84" x2="320" y2="84"/><line x1="84" y1="0" x2="84" y2="112"/><line x1="130" y1="0" x2="130" y2="112"/><line x1="232" y1="0" x2="232" y2="112"/></g>
    <rect width="320" height="112" fill="none" stroke="#dddddd"/>
    <g font-weight="700" font-size="12"><text x="8" y="19">admission_id</text><text x="92" y="19">age</text><text x="138" y="19">prior admissions</text><text x="240" y="19">length of stay</text></g>
    <text x="8" y="47">a001</text><text x="92" y="47">87</text><text x="138" y="47">0</text><text x="240" y="47">4</text>
    <text x="8" y="75">a002</text><text x="92" y="75">64</text><text x="138" y="75">0</text><text x="240" y="75">1</text>
    <text x="8" y="103">a003</text><text x="92" y="103">88</text><text x="138" y="103">1</text><text x="240" y="103">7</text>
  </g>

  <!-- Usage log -->
  <text x="780" y="222" font-size="14" font-weight="700">Usage log</text>
  <g transform="translate(780,232)">
    <rect width="320" height="112" fill="#ffffff" stroke="#dddddd"/>
    <text x="12" y="26" fill="#2f2f2f">Datasets</text><text x="84" y="26">Admissions, Patients</text>
    <text x="12" y="52" fill="#2f2f2f">Features</text><text x="84" y="52">Age at admission 1.0.0</text>
    <text x="84" y="74">Prior admissions 1.0.0</text>
    <text x="84" y="96">Length of stay 1.0.0</text>
  </g>
</svg>
